# Guaranteed: 每个容器的 cpu、memory 都同时设置了 requests 和 limits,且两者相等
apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
spec:
  containers:
    - name: burn
      image: busybox:1.36
      command: ["sh", "-c", "while true; do :; done"]
      resources:
        requests:
          cpu: "1"
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 256Mi
---
# Burstable: 至少设置了 requests 或 limits,但不满足 Guaranteed 的条件(requests < limits)
apiVersion: v1
kind: Pod
metadata:
  name: qos-burstable
spec:
  containers:
    - name: burn
      image: busybox:1.36
      command: ["sh", "-c", "while true; do :; done"]
      resources:
        requests:
          cpu: 500m
          memory: 128Mi
        limits:
          cpu: "2"
          memory: 512Mi
---
# BestEffort: 所有容器都不设置 requests 和 limits
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
spec:
  containers:
    - name: burn
      image: busybox:1.36
      command: ["sh", "-c", "while true; do :; done"]